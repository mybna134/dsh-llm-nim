# dsh-llm-nim bundle patch。
#
# 以一次 insert 挂载 NVIDIA NIM 适配器插件条目，由 profile 根配置叠加。
# 该插件在 apply(ctx, config) 中通过 ctx.llm.registerAdapter 注册
# `nvidia-completions` provider 路由。DSH 0.2.0-rc.2 根据 Config 中的
# volatile 字段提供实时配置表单，以条目 ID `llm-nvidia-completions` 寻址；
# API 密钥经 NVIDIA_API_KEY 凭证引用解析。

- insert:
    - id: llm-nvidia-completions
      name: 'dsh-llm-nim'
